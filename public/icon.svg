<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bidv-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#059669" />
      <stop offset="100%" stop-color="#0f766e" />
    </linearGradient>
    <linearGradient id="gold-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fbbf24" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#064e3b" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Background rounded squircle -->
  <rect x="24" y="24" width="464" height="464" rx="104" fill="url(#bidv-grad)" />

  <!-- Inner border ring -->
  <rect x="36" y="36" width="440" height="440" rx="92" fill="none" stroke="#34d399" stroke-width="6" stroke-opacity="0.4" />

  <!-- Central Visual Container -->
  <g filter="url(#shadow)" transform="translate(0, -10)">
    <!-- Wallet / Card Graphic -->
    <rect x="120" y="140" width="272" height="180" rx="28" fill="#ffffff" />
    <!-- Wallet flap -->
    <path d="M 120 180 L 392 180" stroke="#e2e8f0" stroke-width="4" />
    <!-- Wallet clasp -->
    <rect x="290" y="200" width="102" height="60" rx="16" fill="url(#gold-grad)" />
    <circle cx="330" cy="230" r="10" fill="#ffffff" />

    <!-- Mini chart bars inside wallet -->
    <rect x="160" y="240" width="18" height="40" rx="6" fill="#10b981" />
    <rect x="190" y="220" width="18" height="60" rx="6" fill="#059669" />
    <rect x="220" y="200" width="18" height="80" rx="6" fill="#047857" />
    <circle cx="250" cy="210" r="12" fill="#ef4444" />
    <polyline points="168,240 198,220 228,200 250,210" fill="none" stroke="#10b981" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- BIDV Brand Badge at bottom -->
  <g transform="translate(256, 400)">
    <rect x="-110" y="-36" width="220" height="56" rx="28" fill="#ffffff" />
    <text x="0" y="4" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-weight="900" font-size="34" fill="#065f46" text-anchor="middle" letter-spacing="2">BIDV</text>
  </g>
</svg>
